<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — ShopEase</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-brand">
  <svg width="280" height="75" viewBox="0 0 400 140" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(8, 8)">
      <rect x="0" y="18" width="48" height="40" rx="5" fill="#e94560"/>
      <path d="M8 18 Q8 4 24 4 Q40 4 40 18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="14" cy="34" r="4" fill="#ffffff" opacity="0.9"/>
      <circle cx="34" cy="34" r="4" fill="#ffffff" opacity="0.9"/>
    </g>
    <text x="68" y="52" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#ffffff">Shop</text>
    <text x="140" y="52" font-family="Georgia, serif" font-size="32" font-weight="400" fill="#e94560">Ease</text>
  </svg>
</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">🛒 Cart <span id="cartCount">0</span></a>
      <a href="orders.html">My Orders</a>
<a href="login.html" id="loginBtn">Login</a>
      <a href="#" id="logoutBtn" style="display:none">Logout</a>
    </div>
  </nav>

  <!-- Page Header -->
  <div class="page-header">
    <h1>All Products</h1>
    <p>Find exactly what you're looking for</p>
  </div>

  <!-- Filters -->
  <div class="featured" style="padding-bottom: 0;">
    <div style="display:flex; gap:16px; margin-bottom:24px; flex-wrap:wrap;">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Search products..." 
        style="padding:12px 16px; border:1px solid #ddd; border-radius:6px; font-size:15px; flex:1; min-width:200px;"
        oninput="filterProducts()"
      >
      <select 
        id="categoryFilter" 
        onchange="filterProducts()"
        style="padding:12px 16px; border:1px solid #ddd; border-radius:6px; font-size:15px;"
      >
        <option value="">All Categories</option>
        <option value="Electronics">Electronics</option>
        <option value="Clothing">Clothing</option>
        <option value="Books">Books</option>
        <option value="Home">Home</option>
        <option value="Sports">Sports</option>
      </select>
    </div>
  </div>

  <!-- Products Grid -->
  <section class="featured">
    <div class="alert" id="alert"></div>
    <div class="products-grid" id="productsGrid">
      <p>Loading products...</p>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2025 ShopEase. All rights reserved.</p>
  </footer>

  <script src="../js/main.js"></script>
  <script>
    let allProducts = [];

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        allProducts = await res.json();
        displayProducts(allProducts);
      } catch (error) {
        document.getElementById('productsGrid').innerHTML = 
          '<p>Error loading products.</p>';
      }
    }

    function displayProducts(products) {
      const grid = document.getElementById('productsGrid');

      if (products.length === 0) {
        grid.innerHTML = '<p>No products found.</p>';
        return;
      }

      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.image}" alt="${p.name}" style="width:100%; height:200px; object-fit:cover; border-radius:8px; margin-bottom:16px;">
          <h3>${p.name}</h3>
          <p>${p.description}</p>
          <p style="font-size:13px; color:#999;">Category: ${p.category}</p>
          <p style="font-size:13px; color:${p.stock > 0 ? 'green' : 'red'};">
            ${p.stock > 0 ? `In Stock (${p.stock})` : 'Out of Stock'}
          </p>
          <div class="product-price">$${p.price}</div>
          <button 
  onclick="addToCart('${p._id}', '${p.name}', ${p.price}, ${p.stock})" 
  class="btn-primary"
  ${p.stock === 0 ? 'disabled style="background:#ccc"' : ''}
>
  ${p.stock > 0 ? 'Add to Cart' : 'Out of Stock'}
</button>
        </div>
      `).join('');
    }

    function filterProducts() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;

      const filtered = allProducts.filter(p => {
        const matchSearch = p.name.toLowerCase().includes(search) || 
                           p.description.toLowerCase().includes(search);
        const matchCategory = !category || p.category === category;
        return matchSearch && matchCategory;
      });

      displayProducts(filtered);
    }

    loadProducts();
  </script>

</body>
</html>
